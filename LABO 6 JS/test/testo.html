<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <title>Voorbeeld</title>
</head>
<body>

<input type="checkbox" id="isRoker">
<button onclick="checkRoker()">Check status</button>

<script>
    function checkRoker() {
        let roker = document.getElementById("isRoker").checked;
        console.log(roker ? "Is een roker" : "Is geen roker");
    }
</script>

</body>
</html>
